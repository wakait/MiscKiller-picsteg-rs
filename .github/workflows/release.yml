name: 发布构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（musl 静态链接）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: misc_killer_picsteg_rs
            asset_name: misc_killer_picsteg_rs-linux-x86_64

          # Linux ARM64（musl 静态链接）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: misc_killer_picsteg_rs
            asset_name: misc_killer_picsteg_rs-linux-aarch64

          # macOS x86_64（Intel 芯片）
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: misc_killer_picsteg_rs
            asset_name: misc_killer_picsteg_rs-macos-x86_64

          # macOS ARM64（Apple Silicon 芯片）
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: misc_killer_picsteg_rs
            asset_name: misc_killer_picsteg_rs-macos-aarch64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: misc_killer_picsteg_rs.exe
            asset_name: misc_killer_picsteg_rs-windows-x86_64.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 工具
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

          # 安装 cross 用于 ARM64 交叉编译
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross --git https://github.com/cross-rs/cross || true
          fi

      - name: 配置 cargo 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 release 二进制（ARM64 Linux）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross || true
          cross build --release --target ${{ matrix.target }}

      - name: 构建 release 二进制（其他平台）
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: 剥离符号（Linux x86_64 / macOS）
        if: matrix.os != 'windows-latest' && matrix.target != 'aarch64-unknown-linux-musl'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      # ARM64 Linux 使用 cross 构建，容器内已自动剥离符号，无需额外处理
      # .cargo/config.toml 中也已配置 strip = true

      - name: 准备构建产物
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
            chmod +x artifacts/${{ matrix.asset_name }}
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: 创建发布
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 生成校验和
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "$file.sha256"
            done
            cd ..
          done

      - name: 创建 GitHub 发布
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

