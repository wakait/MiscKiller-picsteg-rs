name: 发布构建

# 推送 v* 标签时触发，构建多平台 release 二进制并创建 GitHub 发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64（MSVC）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: misc_killer_picsteg_rs-windows-x86_64.exe
            exe: misc_killer_picsteg_rs.exe

          # Linux x86_64（musl 静态链接）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: misc_killer_picsteg_rs-linux-x86_64
            exe: misc_killer_picsteg_rs

          # macOS x86_64（Intel）：macos-14 为 ARM runner，通过 x86_64 target 交叉编译，
          # Apple 工具链原生支持双架构，无需额外链接器
          - os: macos-14
            target: x86_64-apple-darwin
            asset: misc_killer_picsteg_rs-macos-x86_64
            exe: misc_killer_picsteg_rs

          # macOS ARM64（Apple Silicon 芯片，macos-latest 现为 ARM runner）
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: misc_killer_picsteg_rs-macos-aarch64
            exe: misc_killer_picsteg_rs

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 musl 工具（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 代码格式检查（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: 静态检查 Clippy（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 单元测试（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --verbose

      - name: 以 release 配置构建
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: 剥离符号（Linux / macOS）
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.exe }}

      - name: 准备构建产物
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} artifacts/${{ matrix.asset }}
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x artifacts/${{ matrix.asset }}
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: 创建 GitHub 发布
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 SHA256 校验和
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && for file in *; do
              if [[ "$file" != *.sha256 ]]; then
                sha256sum "$file" > "$file.sha256"
              fi
            done)
          done

      - name: 创建发布并上传附件
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
