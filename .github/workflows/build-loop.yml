name: build-loop

# 云端构建闭环：仅在开发分支推送时触发，main/master 不受影响。
# 产物供 loop_driver.sh fetch_run 拉取并在本地受控运行。
on:
  push:
    branches:
      - dev
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-loop:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: misc_killer_picsteg_rs-windows-x86_64.exe
            exe: misc_killer_picsteg_rs.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: misc_killer_picsteg_rs-linux-x86_64
            exe: misc_killer_picsteg_rs
          - os: macos-13
            target: x86_64-apple-darwin
            asset: misc_killer_picsteg_rs-macos-x86_64
            exe: misc_killer_picsteg_rs
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: misc_killer_picsteg_rs-macos-aarch64
            exe: misc_killer_picsteg_rs

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 musl 工具（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 代码格式检查（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: 静态检查 Clippy（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 单元测试（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --verbose

      - name: 以 dev-release 配置构建
        run: cargo build --profile dev-release --target ${{ matrix.target }} --verbose

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/dev-release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14
