name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: 配置 cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'

      - name: 运行 Clippy 静态检查
        run: cargo clippy --all-targets --all-features -- -D warnings
        if: matrix.os == 'ubuntu-latest'

      - name: 构建
        run: cargo build --verbose

      - name: 运行单元测试
        run: cargo test --verbose

  build:
    name: 构建
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 以 release 配置构建
        run: cargo build --release --verbose

      - name: 上传二进制（Linux）
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: misc_killer_picsteg_rs-linux
          path: target/release/misc_killer_picsteg_rs

      - name: 上传二进制（macOS）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: misc_killer_picsteg_rs-macos
          path: target/release/misc_killer_picsteg_rs

      - name: 上传二进制（Windows）
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: misc_killer_picsteg_rs-windows
          path: target/release/misc_killer_picsteg_rs.exe

